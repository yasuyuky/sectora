name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release publishing
        run: python3 -m unittest discover -s test -p 'test_release.py' -v

  build:
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
        target: [lib, exe, daemon, deb]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sccache-${{ matrix.arch }}
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.target }}-sccache
      - name: Build
        run: make TARGET=${{ matrix.arch }} ${{ matrix.target }}
      - name: Fix cache permission
        run: sudo chown -R $USER .sccache-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'deb'
        with:
          name: sectora-${{ matrix.arch }}
          path: ${{ github.workspace }}/target/*/debian/*.deb

  set-dists:
    runs-on: ubuntu-latest
    outputs:
      dists: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          content=$(curl -L https://raw.githubusercontent.com/yasuyuky/docker-ssh-test/main/dist.json | jq -c .)
          echo matrix=${content} >>$GITHUB_OUTPUT
          echo ${content}

  test:
    needs: [build, set-dists]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.set-dists.outputs.dists) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sectora-amd64
          path: target
      - name: Allow sectora NSS in the runner's PAM helper profile
        run: |
          # Containers share the runner's AppArmor policy.
          sudo install -D -m 644 assets/apparmor/sectora /etc/apparmor.d/abstractions/nameservice.d/sectora
          if [ -f /etc/apparmor.d/unix-chkpwd ]; then
            sudo apparmor_parser -r -T /etc/apparmor.d/unix-chkpwd
            sudo grep -Fx 'unix-chkpwd (enforce)' /sys/kernel/security/apparmor/profiles
          fi
      - name: Run tests
        run: make test-deb-stub dist=${{ matrix.dist }} ver=${{ matrix.ver }}
        working-directory: test
        env:
          TERM: xterm-256color
      - name: Diagnose PAM failures
        if: failure()
        run: |
          sudo journalctl -k --no-pager --since '-10 minutes'
          docker exec host sh -c 'getent shadow hunter >/dev/null; echo "shadow lookup status: $?"'
          docker exec host sh -c '/usr/sbin/unix_chkpwd hunter chkexpiry </dev/null; echo "PAM helper status: $?"'
          docker exec host journalctl -u ssh -u sectora --no-pager -n 100
