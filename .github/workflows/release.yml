name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Build deb
        run: make TARGET=${{ matrix.arch }} deb
      - name: Collect package
        run: |
          mkdir dist
          cp target/*/debian/*.deb dist/
      - uses: actions/upload-artifact@v7
        with:
          name: sectora-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          overwrite: true

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: sectora-*
          path: dist
          merge-multiple: true
      - name: Publish release
        run: bash .github/scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
